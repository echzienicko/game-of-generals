package:
  name: generals
  description: Game of the Generals - real-time two-player game

spring:
  application:
    name: generals

server:
  port: 8080
  # Bind every interface, not just loopback. Required for LAN play: the browser
  # fetches /api and opens SockJS on /ws relative to whatever host served the page,
  # so serving the SPA from this same port makes the whole game a single origin and
  # CORS never comes into play.
  address: 0.0.0.0

# There is deliberately no CORS configuration. An earlier `spring.cors.allowed-origins`
# here was dead weight: that property does not exist in Spring Boot 3 (only
# `spring.graphql.cors.*` does), so it configured nothing and gave false comfort that
# origins were being checked. Nothing checks them. If you ever serve the frontend from a
# different origin than the API, add a real WebMvcConfigurer CORS bean - a property will
# not do it.

# Player names and their wins. Unlike games, this is persisted, so a score survives a
# restart; relative to the working directory the server is started in.
generals:
  leaderboard:
    path: data/leaderboard.json
